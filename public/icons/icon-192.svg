<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e"/>
      <stop offset="100%" stop-color="#161922"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Outer concentric sound wave circles -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8 8" opacity="0.3"/>
  
  <!-- Play & Waveform Icon -->
  <g transform="translate(48, 48)">
    <!-- Video Verse 'V' + Play Triangle -->
    <path d="M12 20 L48 76 L84 20" fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <polygon points="40,36 64,48 40,60" fill="url(#primaryGrad)"/>
    <!-- Equalizer bars inside -->
    <rect x="22" y="14" width="4" height="18" rx="2" fill="#06b6d4" opacity="0.9"/>
    <rect x="70" y="14" width="4" height="18" rx="2" fill="#8b5cf6" opacity="0.9"/>
  </g>
</svg>
