<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="primaryGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#primaryGrad512)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Outer concentric sound wave circles -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="14 14" opacity="0.3"/>
  
  <!-- Play & Waveform Icon -->
  <g transform="translate(128, 128)">
    <path d="M32 50 L128 200 L224 50" fill="none" stroke="url(#primaryGrad512)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow512)"/>
    <polygon points="106,94 170,128 106,162" fill="url(#primaryGrad512)"/>
    <!-- Equalizer bars inside -->
    <rect x="58" y="36" width="10" height="48" rx="5" fill="#06b6d4" opacity="0.9"/>
    <rect x="188" y="36" width="10" height="48" rx="5" fill="#8b5cf6" opacity="0.9"/>
  </g>
</svg>
